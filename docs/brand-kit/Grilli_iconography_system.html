<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Grilli iconography system</title>
    <style>
      :root {
        --bg: #f4efe7;
        --card: #fbf8f3;
        --tx: #1a1511;
        --mu: #5e564d;
        --ln: #d9d0c3;
        --ac: #795f2e;
        --pk: #d9667e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #191614;
          --card: #24211d;
          --tx: #f3efeb;
          --mu: #bbb7b2;
          --ln: #423e3b;
          --ac: #e4c590;
          --pk: #e58aa0;
        }
      }
      :root[data-theme="dark"] {
        --bg: #191614;
        --card: #24211d;
        --tx: #f3efeb;
        --mu: #bbb7b2;
        --ln: #423e3b;
        --ac: #e4c590;
        --pk: #e58aa0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 18px 70px;
      }
      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
      }
      h1 {
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.15;
      }
      h2 {
        font-size: 25px;
        margin: 44px 0 4px;
        padding-top: 18px;
        border-top: 1px solid var(--ln);
      }
      h3 {
        font-size: 14px;
        margin: 18px 0 8px;
      }
      .lead {
        color: var(--mu);
        max-width: 74ch;
        margin: 4px 0 12px;
      }
      .k {
        color: var(--ac);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .g {
        display: grid;
        gap: 10px;
      }
      .c2 {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .c3 {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .c4 {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 14px;
      }
      .sc {
        overflow-x: auto;
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .tbl th,
      .tbl td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--ln);
        text-align: left;
        vertical-align: top;
      }
      .tbl th {
        color: var(--mu);
        font-weight: 500;
        font-size: 12px;
      }
      code {
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .pill {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 99px;
        border: 1px solid currentColor;
        white-space: nowrap;
      }
      .ok {
        color: #4e7d43;
      }
      .no {
        color: #b2433b;
      }
      .wn {
        color: #9a6a1c;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .ok {
          color: #91c985;
        }
        :root:not([data-theme="light"]) .no {
          color: #f69c90;
        }
        :root:not([data-theme="light"]) .wn {
          color: #f4a34b;
        }
      }
      .dk {
        background: #191614;
        color: #f3efeb;
        border-radius: 10px;
        padding: 18px;
      }
      .dk .m {
        color: #bbb7b2;
      }
      .dk .gd {
        color: #e4c590;
      }
      ul.l {
        padding-left: 18px;
      }
      ul.l li {
        margin: 3px 0;
      }
      .two {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 12px;
      }
      .bar {
        display: inline-block;
        height: 12px;
        background: var(--ac);
        border-radius: 2px;
        vertical-align: middle;
      }
      .stat {
        font-family: Georgia, serif;
        font-size: 30px;
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const h2r = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16)),
        lin = (c) => {
          c /= 255;
          return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        },
        Lm = (h) => {
          const [r, g, b] = h2r(h).map(lin);
          return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        },
        cr = (a, b) =>
          ((Math.max(Lm(a), Lm(b)) + 0.05) / (Math.min(Lm(a), Lm(b)) + 0.05)).toFixed(1);

          `<div class="dk" style="margin-top:10px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span style="width:44px;height:44px;border:1px dashed #E58AA0;display:inline-flex;align-items:center;justify-content:center;color:#F3EFEB">${svg("close", 20)}</span><span class="m" style="font-size:12px">20px icon, 12px padding, 44px target</span><span style="display:inline-flex;gap:8px;align-items:center;color:#F3EFEB">${svg("phone", 16)} +1 123 456 7890</span><span class="m" style="font-size:12px">16px icon, 8px gap</span></div>`,

      A.push(
        `<h2>08 · Usage rules</h2><div class="two"><div class="card"><b class="ok">Do</b><ul class="l"><li>One library, one 1.5px outline style.</li><li>Pair an icon with a visible word, or give it an accessible name.</li><li>Use <code>currentColor</code> so icons follow text colour and state.</li><li>Keep 44px targets for tappable icons.</li><li>Draw missing icons to the grid.</li></ul></div><div class="card"><b class="no">Don't</b><ul class="l"><li>No mixing filled and outline icons.</li><li>No coloured icons outside the token list.</li><li>No icon-only controls without an accessible name.</li><li>No scaling a 24px icon to 40px: pick the 32 or 48 size.</li><li>No rasters for icons.</li></ul></div></div>`,
      );
      A.push(
        `<h2>09 · Live preview: icons in context</h2><div class="g c2"><div class="dk"><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px">${[

          .join(

          )}</div><div style="margin-top:14px;display:flex;gap:10px;align-items:center;background:#24211D;border:1px solid #706D68;padding:0 14px;height:56px;color:#BBB7B2">${svg("user", 16)}<span style="flex:1;color:#F3EFEB">2 Guests</span>${svg("chevron-down", 16)}</div><div style="margin-top:14px;display:flex;gap:12px"><span style="display:inline-flex;gap:8px;align-items:center;background:#E4C590;color:#0F0D0B;padding:16px 28px;font:600 13px/1.3 system-ui;letter-spacing:.14em;text-transform:uppercase">View menu ${svg("arrow-right", 16, 1.5)}</span></div></div><div class="dk" style="display:grid;gap:10px"><div style="display:flex;gap:10px;align-items:flex-start;background:${E.success.tint};border:1px solid ${E.success.border};color:${E.success.text};padding:10px 12px"><span style="color:${E.success.solid}">${svg("check", 20, 2)}</span><span style="font-size:14px">Table booked for Friday, 7 pm.</span></div><div style="display:flex;gap:10px;align-items:flex-start;background:${E.error.tint};border:1px solid ${E.error.border};color:${E.error.text};padding:10px 12px"><span style="color:${E.error.solid}">${svg("error", 20, 2)}</span><span style="font-size:14px">Enter a valid phone number.</span></div><div style="display:flex;gap:18px;color:#E4C590;justify-content:space-around;padding-top:6px">${["salad", "chef-hat", "wine", "party"].map((n) => svg(n, 40, 2)).join("")}</div></div></div>`,

        [

      A.push(
        `<h2>10 · Full iconography touchpoint map</h2><p class="lead">Every icon in the code: where it lives, how it renders today, and what the system proposes.</p>` +

      A.push(
        `<h2>11 · Accessibility rules</h2><ul class="l"><li>Decorative icons next to text get <code>aria-hidden="true"</code> (already done in your icon component).</li><li>An icon-only button needs an accessible name (<code>aria-label</code>); this is already true for close, open menu, arrows and back-to-top.</li><li>Icons that carry meaning need 3:1 contrast against their background (section 03).</li><li>Status icons never work alone: always icon plus word, because colour alone fails some viewers.</li><li>Tappable icons reach 44px where space allows and never fall under 24px (WCAG 2.2 AA).</li><li>Don't rely on a shape that varies by library to say something different (an arrow is always "go", a check is always "success").</li></ul>`,

      A.push(
        `<h2>12 · Research notes and decisions</h2><ul class="l"><li>Common spec: 24px canvas, 2px padding, 1.5 to 2px stroke, sizes 16/20/24 and larger for illustration; keyline shapes for optical balance.</li><li>Library counts and licences come from comparison articles; verify before adoption. I drew every icon here myself as a draft, so exact shapes will differ from the final set.</li><li>I have not measured rendered strokes in a browser: they are computed from each icon's size and stroke setting.</li></ul><h3>Decisions</h3><ol class="l"><li>Library: Lucide at 1.5px (recommended), Phosphor Light, or keep Ionicons and normalise?</li><li>Replace the four gold category images with SVG icons?</li><li>Raise the close button and hamburger to 44px targets?</li></ol>`,
