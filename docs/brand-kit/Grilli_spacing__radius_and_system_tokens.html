<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Grilli spacing, radius and system tokens</title>
    <style>
      :root {
        --bg: #f4efe7;
        --card: #fbf8f3;
        --tx: #1a1511;
        --mu: #5e564d;
        --ln: #d9d0c3;
        --ac: #795f2e;
        --pk: #d9667e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #191614;
          --card: #24211d;
          --tx: #f3efeb;
          --mu: #bbb7b2;
          --ln: #423e3b;
          --ac: #e4c590;
          --pk: #e58aa0;
        }
      }
      :root[data-theme="dark"] {
        --bg: #191614;
        --card: #24211d;
        --tx: #f3efeb;
        --mu: #bbb7b2;
        --ln: #423e3b;
        --ac: #e4c590;
        --pk: #e58aa0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 18px 70px;
      }
      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
      }
      h1 {
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.15;
      }
      h2 {
        font-size: 25px;
        margin: 44px 0 4px;
        padding-top: 18px;
        border-top: 1px solid var(--ln);
      }
      h3 {
        font-size: 14px;
        margin: 18px 0 8px;
      }
      .lead {
        color: var(--mu);
        max-width: 74ch;
        margin: 4px 0 12px;
      }
      .k {
        color: var(--ac);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .g {
        display: grid;
        gap: 10px;
      }
      .c2 {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .c3 {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .c4 {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 14px;
      }
      .sc {
        overflow-x: auto;
      }
      .tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .tbl th,
      .tbl td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--ln);
        text-align: left;
        vertical-align: top;
      }
      .tbl th {
        color: var(--mu);
        font-weight: 500;
        font-size: 12px;
      }
      code {
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .pill {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 99px;
        border: 1px solid currentColor;
        white-space: nowrap;
      }
      .ok {
        color: #4e7d43;
      }
      .no {
        color: #b2433b;
      }
      .wn {
        color: #9a6a1c;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .ok {
          color: #91c985;
        }
        :root:not([data-theme="light"]) .no {
          color: #f69c90;
        }
        :root:not([data-theme="light"]) .wn {
          color: #f4a34b;
        }
      }
      .dk {
        background: #191614;
        color: #f3efeb;
        border-radius: 10px;
        padding: 18px;
      }
      .dk .m {
        color: #bbb7b2;
      }
      .dk .gd {
        color: #e4c590;
      }
      ul.l {
        padding-left: 18px;
      }
      ul.l li {
        margin: 3px 0;
      }
      .two {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 12px;
      }
      .bar {
        display: inline-block;
        height: 12px;
        background: var(--ac);
        border-radius: 2px;
        vertical-align: middle;
      }
      .stat {
        font-family: Georgia, serif;
        font-size: 30px;
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const h2r = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16)),
        lin = (c) => {
          c /= 255;
          return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        },
        Lm = (h) => {
          const [r, g, b] = h2r(h).map(lin);
          return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        },
        cr = (a, b) =>
          ((Math.max(Lm(a), Lm(b)) + 0.05) / (Math.min(Lm(a), Lm(b)) + 0.05)).toFixed(1);
      const f1 = (n) => (+n).toFixed(1),
        tb = (h, rows) =>
          `<div class="sc"><table class="tbl"><tr>${h.map((x) => `<th>${x}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
      const A = [],
        S0 = "#0F0D0B",
        S1 = "#191614",
        S2 = "#24211D",
        GO = "#E4C590",
        IV = "#F3EFEB",
        MU = "#BBB7B2";

      const D = {
          spacing: [

            [12.0, 5, ["Header", "Hero", "NewsletterForm", "Service", "SpecialDish"], 12, 0.0],
            [14.0, 1, ["Hero"], 12, -2.0],
            [15.0, 5, ["About", "Menu", "Navbar", "Testimonial"], 16, 1.0],
            [16.0, 2, ["Service", "SpecialDish"], 16, 0.0],
            [
              20.0,

              [
                "Features",

                "About",

              ],
              40,

            ],
            [45.0, 1, ["Preloader"], 48, 3.0],
            [
              50.0,
              7,
              ["AboutBanner", "Footer", "Menu", "Navbar", "SpecialDish", "Testimonial"],
              48,
              -2.0,
            ],
            [55.0, 2, ["Menu"], 48, -7.0],
            [60.0, 3, ["Navbar", "Reservation", "ReservationForm"], 64, 4.0],
            [70.0, 2, ["Footer", "SpecialDish"], 64, -6.0],
            [75.0, 5, ["Reservation", "ReservationForm", "Service"], 80, 5.0],
            [80.0, 1, ["About"], 80, 0.0],
            [90.0, 3, ["About", "AboutBanner", "Menu"], 96, 6.0],
            [100.0, 4, ["About", "Footer", "Hero", "Navbar"], 96, -4.0],
            [120.0, 4, ["About", "AboutBanner", "Hero", "SpecialDish"], 120, 0.0],
            [150.0, 1, ["Service"], 160, 10.0],
            [170.0, 1, ["About"], 160, -10.0],
            [200.0, 1, ["Menu"], 160, -40.0],
            [205.0, 1, ["NewsletterForm"], 160, -45.0],
            [225.0, 1, ["SpecialDish"], 160, -65.0],
            [270.0, 1, ["Reservation"], 160, -110.0],
            [340.0, 1, ["Testimonial"], 160, -180.0],
          ],
          offset: [

            [20.0, 5, ["BackToTop", "Navbar"], 20, 0.0],

            [50.0, 2, ["Hero"], 48, -2.0],
            [51.0, 1, ["Header"], 48, -3.0],

            [80.0, 1, ["Features"], 80, 0.0],
            [120.0, 1, ["AboutBanner"], 120, 0.0],
            [160.0, 1, ["Service"], 160, 0.0],
            [360.0, 2, ["Navbar"], 160, -200.0],
          ],
          size: [
            [2.0, 3, ["Header"], 4, 2.0],

            [8.0, 2, ["Navbar", "Separator"], 8, 0.0],
            [15.0, 2, ["Footer"], 16, 1.0],
            [30.0, 3, ["Header"], 32, 2.0],
            [45.0, 1, ["Hero"], 48, 3.0],
            [50.0, 1, ["BackToTop"], 48, -2.0],
            [110.0, 1, ["Hero"], 120, 10.0],
            [112.0, 1, ["Preloader"], 120, 8.0],
            [140.0, 3, ["AboutBanner", "ReservationForm", "Service"], 120, -20.0],
            [150.0, 1, ["AboutBanner"], 160, 10.0],
            [285.0, 1, ["AboutBanner"], 160, -125.0],
            [360.0, 1, ["Navbar"], 160, -200.0],
          ],
        },
        TP = {
          About: [
            "2xl:pr-90",
            "gap-120",
            "lg:gap-30",
            "mb-30",
            "mt-15",
            "mt-26",
            "sm:gap-80",

          ],
          AboutBanner: ["mb-120", "pl-50", "py-50", "sm:pl-90"],
          Events: ["gap-40", "mb-40", "mb-5", "mt-40", "pb-25", "pt-35", "px-10", "px-35", "py-5"],
          Features: ["gap-40", "mb-40", "my-20", "pb-40", "pt-30", "px-20"],
          Footer: [
            "gap-2",

          ],
          Header: ["gap-8", "my-4", "p-12", "px-20", "py-20", "py-40"],
          Hero: [
            "after:mb-20",
            "after:mt-14",
            "mb-40",
            "mb-6",
            "mt-10",
            "p-12",
            "pt-100",
            "py-120",
          ],
          Menu: [
            "gap-20",

            "mb-50",
            "mt-10",
            "mt-26",
            "my-10",

            "xl:gap-x-200",
            "xl:gap-y-55",

          ],
          Navbar: [
            "mb-10",
            "mb-100",
            "mb-15",
            "mb-20",
            "mb-60",
            "md:mx-30",
            "mt-30",
            "my-10",
            "my-30",
            "p-4",
            "pb-50",
            "px-30",
            "py-10",
            "xl:gap-30",
            "xl:mr-20",
          ],
          NewsletterForm: ["mt-12", "sm:pr-205"],
          Preloader: ["mb-45"],
          Reservation: [
            "-mt-270",
            "mb-25",
            "mb-40",
            "mb-5",
            "my-20",
            "pb-30",
            "pt-40",
            "px-20",
            "xl:pb-75",
            "xl:pt-75",
            "xl:px-60",
          ],
          ReservationForm: [
            "mb-20",
            "mb-40",
            "md:gap-x-20",
            "pb-30",
            "pr-10",
            "pt-40",
            "px-20",
            "py-20",
            "xl:pb-75",
            "xl:pt-75",
            "xl:px-60",
          ],
          Service: [
            "gap-40",
            "mb-12",
            "mb-16",
            "mb-26",
            "mb-40",
            "pb-4",
            "py-30",
            "xl:gap-150",
            "xl:mb-75",
          ],
          SpecialDish: [
            "gap-20",
            "lg:pl-50",
            "lg:pr-25",
            "mb-12",
            "mb-40",
            "mt-16",
            "py-70",
            "xl:pl-120",
            "xl:py-225",
          ],
          Testimonial: ["gap-2", "mb-15", "mb-50", "mt-40", "pb-340"],
          Topbar: ["gap-30", "gap-6", "py-10"],
        };
      const CORE = [4, 8, 12, 16, 20, 24, 32, 40, 48, 56, 64],
        LAY = [72, 80, 96, 120, 160, 200],
        SC = [...CORE, ...LAY];
      const OVR = { 14: 12, 205: 208 },
        nn0 = (v) =>
          SC.reduce(
            (b, x) =>
              Math.abs(x - v) < Math.abs(b - v) || (Math.abs(x - v) === Math.abs(b - v) && x > b)
                ? x
                : b,
            SC[0],
          ),
        nn = (v) => OVR[v] || nn0(v);
      const NOTE = {
        205: "right padding of the Subscribe field: 208 (step 52), must stay wider than the button; a named exception",
        225: "vertical centring: use flex centring instead of a number",
        270: "form/testimonial overlap: named --spacing-overlap (272)",
        340: "overlap + section space: calc(), never typed",
        285: "natural width of the about photo (an asset size)",
        200: "menu column gap: a layout step",
        170: "about top offset: layout step 160",
        150: "service grid gap: layout step 160",
        110: "hero badge size",
        51: "topbar height: fixed at 48 (h-12), header offset sm:top-12",
        65: "offset: 64",
        55: "menu row gap: 56",
      };
      const kind = (v) => {
        const t = nn(v),
          d = Math.abs(t - v);
        return v % 4 === 0 && SC.includes(v)
          ? ["grid", "ok"]
          : v % 4 === 0
            ? ["4px, off scale", "wn"]
            : d <= 3
              ? ["snap", "ok"]
              : d <= 10
                ? ["review", "wn"]
                : ["derived", "no"];
      };
      const all = ["spacing", "offset", "size"].flatMap((f) =>
        D[f].map((r) => ({ f, v: r[0], u: r[1], w: r[2], t: nn(r[0]), d: nn(r[0]) - r[0] })),
      );
      const tot = (f) => D[f].reduce((a, r) => a + r[1], 0),
        offg = (f) => D[f].filter((r) => r[0] % 4).reduce((a, r) => a + r[1], 0);
      A.push(
        `<p class="k">Brand kit · 03 Spacing, radius and system tokens</p><h1>Grilli spacing, radius and system tokens</h1><p class="lead">Measured from your real code (the Next.js and Tailwind project), then researched and proposed. The page keeps your look: wherever a value moves, the change is shown in pixels so you can judge it. Typography changes ripple into spacing (body line height 1.85 to 1.65, button label lh 1.3), so those effects are included.</p><div class="g c4"><div class="card"><div class="stat">${tot("spacing")}</div>spacing utilities, ${D.spacing.length} different values</div><div class="card"><div class="stat">${Math.round((100 * offg("spacing")) / tot("spacing"))}%</div>of spacing uses are off a 4px grid</div><div class="card"><div class="stat">6</div>different z-index values, none named</div><div class="card"><div class="stat">3</div>radii in use: square, 24px, circle</div></div>`,
      );
      A.push(
        `<h2>01 · Base unit and spacing scale</h2><p class="lead">Research: a 4px base gives finer control than 8px and is what most systems use internally; numbers in the scale should mean multipliers, not pixels; and values should be derived from a scale, never typed freely. Your Tailwind setup currently makes one unit equal one pixel (<code>p-20</code> is 20px), the opposite of the Tailwind convention (<code>p-5</code> is 20px). Switching to 4px per unit makes names match multipliers.</p><div class="g c2"><div class="card"><b>Core scale (11 steps to 64px)</b>${CORE.map((v, i) => `<div style="display:grid;grid-template-columns:54px 56px 1fr;gap:8px;align-items:center;padding:3px 0"><code>space-${v / 4}</code><code>${v}px</code><span class="bar" style="width:${v * 2.6}px"></span></div>`).join("")}</div><div class="card"><b>Layout scale (sections and big offsets)</b>${LAY.map((v) => `<div style="display:grid;grid-template-columns:54px 56px 1fr;gap:8px;align-items:center;padding:3px 0"><code>space-${v / 4}</code><code>${v}px</code><span class="bar" style="width:${v * 1.2}px;opacity:.7"></span></div>`).join("")}<p class="lead" style="margin-top:8px">Half-step: <code>space-0.5</code> = 2px, only for hairline gaps (the dots between separators).</p></div></div><p class="lead" style="margin-top:8px">Why 56: your menu rows use 55px; 56 is the closest on-grid value, so that step is only 1px different instead of 7. Why 72: it replaces 70 and 75.</p>`,
      );
      const SEM = [
        ["space-gutter", "16 (20 in header)", "Page side padding on phones"],
        ["space-inline-xs", "4", "Icon and underline offsets"],
        ["space-inline-sm", "8", "Gap between icon and label; between inline items"],
        ["space-inline-md", "12–16", "Gap between badge, price, title"],
        ["space-field", "20", "Gap between form fields"],
        ["space-stack-sm", "8–12", "Title to description"],
        ["space-stack-md", "16–24", "Paragraph to paragraph, label to field"],
        ["space-stack-lg", "32–40", "Block to block inside a section"],
        ["space-inset-sm", "12", "Compact padding: input vertical padding, tags"],
        ["space-inset-md", "16–20", "Card side padding, button vertical padding (20)"],
        ["space-inset-lg", "32–48", "Card and panel padding, button horizontal 48"],
        ["space-section", "72 (96 from 992px)", "Top and bottom of every section"],
        ["space-hero", "120", "Hero vertical padding"],
        ["space-overlap", "272", "Reservation form lifted over the testimonial"],
      ];
      A.push(
        `<h2>02 · Semantic spacing: where each step is used</h2><p class="lead">Seven roles are real tokens with one value each (gutter, inline-xs, inline-sm, field, section, hero, overlap). The rest are roles that map to scale steps, shown as ranges, so components use the numbered scale for them.</p>` +
          tb(
            ["Token", "Value", "Used for"],
            SEM.map((r) => [`<code>${r[0]}</code>`, r[1], r[2]]),
          ),
      );
      A.push(
        `<h2>03 · Drift audit</h2><p class="lead">Every number-based spacing, offset and size class in your components, compared with the nearest step on the proposed scale. <b>${all.filter((r) => r.v % 4).length}</b> of ${all.length} distinct values are off the 4px grid. Rule used: 3px or less = snap, 4–10px = review, more than 10px = derived or structural (the number should not exist). Ties round up (6 to 8, 10 to 12); two exceptions: 14 to 12 (hero subtitle) and 205 to 208 (the Subscribe field).</p>` +
          tb(
            ["Family", "Value", "Uses", "Where", "Nearest step", "Change", "Verdict"],
            all
              .filter((r) => r.v % 4 || !SC.includes(r.v))
              .map((r) => {
                const k = kind(r.v);
                return [
                  r.f,
                  `<code>${r.v}px</code>`,
                  r.u,
                  r.w.join(", "),
                  `<code>${r.t}px</code>`,
                  (r.d > 0 ? "+" : "") + r.d + "px",
                  `<span class="pill ${k[1]}">${k[0]}</span>${NOTE[r.v] ? '<br><span style="font-size:11.5px;color:var(--mu)">' + NOTE[r.v] + "</span>" : ""}`,

          ) +
          `<p class="lead" style="margin-top:8px">Already on the grid: ${all
            .filter((r) => r.v % 4 === 0 && SC.includes(r.v))
            .map((r) => r.v)
            .join(", ")}px.</p>`,
      );
      A.push(
        `<h2>04 · Vertical rhythm: section spacing</h2><p class="lead">Every band keeps the same vertical padding; only the background changes. Today: 70px on phones, 100px from 992px, with a few one-off values.</p><div class="g c2"><div class="card"><b>Proposed</b><div style="margin-top:8px;background:${S1};color:${IV};padding:0;border-radius:6px;overflow:hidden">${["Hero · 120", "Services · 72 / 96", "About · 72 / 96 (top 160 desktop)", "Special dish · 72 / 96", "Menu · 72 / 96", "Testimonial · 72 + overlap", "Reservation · overlaps 272", "Features · 72 / 96", "Events · 72 / 96", "Footer · 72 / 96"].map((t, i) => `<div style="padding:7px 12px;border-bottom:1px solid #423E3B;background:${i % 2 ? S0 : S1};font-size:12px">${t}</div>`).join("")}</div></div><div class="card"><b>Rules</b><ul class="l"><li><code>space-section</code> is the only top and bottom padding of a band: 72px, 96px from 992px.</li><li>Overlaps are named: the testimonial bottom padding is <code>calc(space-overlap + space-section)</code>, so the two always agree (today 340 = 270 + 70, typed twice).</li><li>Special dish is centred with flex (no 225px); about uses the 160 layout step (no 170px).</li><li>Inside a band: stack-lg (40) between blocks, stack-md (24) between paragraphs.</li></ul></div></div>`,
      );
      const CM = [
        [
          "Button",
          "padding 12 × 45, height 58 (label line height 29.6)",
          "padding 20 × 48, height 61 (label 13px, lh 1.3)",
        ],
        [
          "Input",

        ],
